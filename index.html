<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상식 퀴즈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p id="student-info" class="student-info">학번 202402165 이름 김지민</p>

  <!-- 시작 화면 -->
  <section id="screen-start">
    <h1>상식 퀴즈</h1>
    <p class="notice">카테고리를 고르세요.</p>
    <div id="category-options" class="option-list"></div>
  </section>

  <!-- 모드 선택 화면 -->
  <section id="screen-mode" hidden>
    <h2 id="mode-title"></h2>
    <div id="mode-options" class="option-list"></div>
    <div class="actions">
      <button id="mode-back-btn">처음으로</button>
    </div>
  </section>

  <!-- 문제 화면 -->
  <section id="screen-quiz" hidden>
    <p id="quiz-meta" class="meta"></p>
    <p id="timer" class="timer" hidden></p>
    <h2 id="question-text"></h2>
    <div id="choices">
      <button class="choice" data-index="0"></button>
      <button class="choice" data-index="1"></button>
      <button class="choice" data-index="2"></button>
      <button class="choice" data-index="3"></button>
    </div>
    <button id="hint-btn" class="hint" hidden>힌트 (오답 2개 지우기)</button>
    <div id="feedback" hidden>
      <p id="feedback-verdict"></p>
      <p id="feedback-explanation"></p>
      <a id="feedback-source" target="_blank" rel="noopener"></a>
    </div>
    <div class="actions">
      <button id="next-btn" class="primary" hidden>다음</button>
      <button id="quit-btn">그만두기</button>
    </div>
  </section>

  <!-- 결과 화면 -->
  <section id="screen-result" hidden>
    <h2>결과</h2>
    <p id="score-text" class="score"></p>
    <p id="retry-text" hidden></p>
    <p id="result-notice" class="notice" hidden></p>
    <div class="actions">
      <button id="retry-btn" hidden>틀린 문제 다시 풀기</button>
      <button id="replay-btn" class="primary">같은 설정으로 다시</button>
      <button id="home-btn">처음으로</button>
    </div>
  </section>

  <!-- 순위표 화면 (3단계) -->
  <section id="screen-board" hidden></section>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
